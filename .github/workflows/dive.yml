name: dive

on:
  push:
    paths:
      - "Dockerfile"
      - "app/**"
      - ".dive-ci"
      - ".github/workflows/dive.yml"
  pull_request:
  workflow_dispatch:

jobs:
  image-efficiency:
    runs-on: ubuntu-24.04
    env:
      IMAGE: devops-hw-app:ci
      DIVE_IMAGE: wagoodman/dive:v0.13.1
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t "$IMAGE" .

      - name: Image size
        run: docker image ls "$IMAGE"

      # Без "|| true": при нарушении любого порога из .dive-ci dive
      # возвращает код 1, и job падает.
      - name: Check layers with dive
        run: |
          docker run --rm \
            -e CI=true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dive-ci:/.dive-ci:ro" \
            "$DIVE_IMAGE" "$IMAGE" --ci-config /.dive-ci
