services:
  app:
    command: ["flask", "--app", "app", "run", "--debug", "--host=0.0.0.0", "--port=8000"]
    environment:
      FLASK_DEBUG: "1"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app
          ignore:
            - requirements.txt
            - __pycache__/
        - action: rebuild
          path: ./app/requirements.txt
        - action: rebuild
          path: ./Dockerfile
